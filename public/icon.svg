        fill="url(#g)"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
        font-weight="700" font-size="360" text-anchor="middle"
        letter-spacing="-10">N</text>
</svg>
